name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  # ── 1. Backend lint ──────────────────────────────────────────────────────
  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check app/

  # ── 2. Backend unit + API tests (SQLite in-memory) ───────────────────────
  backend-test:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Run tests (exclude integration)
        env:
          OPENAI_API_KEY: "sk-test-placeholder"
          DATABASE_URL: "sqlite://"
        run: |
          pytest tests/ -q \
            --ignore=tests/test_integration.py \
            --tb=short

  # ── 3. Backend integration tests (real PostgreSQL) ───────────────────────
  backend-integration:
    name: Backend integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: backend-test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pipidepulus
          POSTGRES_PASSWORD: pipidepulus
          POSTGRES_DB: pipidepulus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: "postgresql://pipidepulus:pipidepulus@localhost:5432/pipidepulus_test"
          DATABASE_URL: "postgresql://pipidepulus:pipidepulus@localhost:5432/pipidepulus_test"
          OPENAI_API_KEY: "sk-test-placeholder"
        run: |
          pytest tests/test_integration.py -v --tb=short

  # ── 4. Alembic migration check ───────────────────────────────────────────
  migration-check:
    name: Alembic migration check
    runs-on: ubuntu-latest
    needs: backend-test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pipidepulus
          POSTGRES_PASSWORD: pipidepulus
          POSTGRES_DB: pipidepulus_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations
        env:
          DATABASE_URL: "postgresql://pipidepulus:pipidepulus@localhost:5432/pipidepulus_check"
        run: alembic upgrade head

      - name: Verify no pending schema changes
        env:
          DATABASE_URL: "postgresql://pipidepulus:pipidepulus@localhost:5432/pipidepulus_check"
        run: |
          # alembic check exits non-zero if there are unapplied migrations
          alembic check

  # ── 5. Frontend build ─────────────────────────────────────────────────────
  frontend-build:
    name: Frontend build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          BACKEND_URL: "http://backend:8000"

  # ── 6. Smoke test (docker-compose) ───────────────────────────────────────
  smoke-test:
    name: Smoke test (docker-compose health)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Create minimal .env for smoke test
        run: |
          cat > .env << 'EOF'
          OPENAI_API_KEY=sk-test-placeholder
          OPENAI_MODEL=gpt-4.1-mini
          OPENAI_VECTOR_STORE_ID=vs_placeholder
          OPENAI_PROJECTS_VECTOR_STORE_ID=vs_placeholder2
          EOF

      - name: Start services
        run: docker compose up -d db backend
        timeout-minutes: 3

      - name: Wait for backend to be healthy
        run: |
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/health || true)
            if [ "$status" = "200" ] || [ "$status" = "503" ]; then
              echo "Backend responded with HTTP $status"
              exit 0
            fi
            echo "Attempt $i: got $status, retrying..."
            sleep 2
          done
          echo "Backend did not respond in time"
          docker compose logs backend
          exit 1

      - name: Assert health endpoint responds
        run: |
          curl -f http://localhost:8000/api/health || \
          curl -s http://localhost:8000/api/health | grep -q '"database"'

      - name: Tear down
        if: always()
        run: docker compose down -v
