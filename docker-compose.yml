services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pipidepulus
      POSTGRES_PASSWORD: pipidepulus
      POSTGRES_DB: pipidepulus_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://pipidepulus:pipidepulus@db:5432/pipidepulus_db
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      CHROMA_DB_PATH: /vector_db
      STORAGE_LOCAL_PATH: /var/pipidepulus/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - ./data/vector_db:/vector_db
      - ./data/storage:/var/pipidepulus/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata:
